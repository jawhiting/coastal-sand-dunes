<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sand Dunes Explorer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.6;
        }
        #mode-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
        }
        #debug-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="controls-info">
        <strong>Controls:</strong><br>
        WASD - Move<br>
        Mouse - Look around<br>
        Space - Toggle Walk/Fly mode<br>
        Shift - Move faster<br>
        Q - Up / E - Down (Fly mode)<br>
        Click to lock pointer
    </div>
    <div id="mode-indicator">Fly Mode</div>
    <div id="debug-info">
        X: 0.0<br>
        Y: 250.0<br>
        Z: 0.0
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0xb8d4e6, 300, 1500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 250, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
        sunLight.position.set(100, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -800;
        sunLight.shadow.camera.right = 800;
        sunLight.shadow.camera.top = 800;
        sunLight.shadow.camera.bottom = -800;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const hemisphereLight = new THREE.HemisphereLight(0x87ceeb, 0xd4a574, 0.6);
        scene.add(hemisphereLight);

        // Improved noise function
        function noise(x, y, seed = 0) {
            const n = Math.sin(x * 0.1 + seed) * Math.cos(y * 0.1 + seed) *
                      Math.sin((x + y) * 0.05 + seed * 2);
            return n * 0.5 + 0.5;
        }

        // Multi-octave noise for natural terrain
        function multiOctaveNoise(x, y) {
            let value = 0;
            let amplitude = 1;
            let frequency = 1;
            const octaves = 8;

            for (let i = 0; i < octaves; i++) {
                value += noise(x * frequency * 0.008, y * frequency * 0.008, i * 100) * amplitude;
                amplitude *= 0.55;
                frequency *= 2.2;
            }

            return value;
        }

        // Procedural terrain generation
        function generateTerrain(width, depth, segments) {
            const geometry = new THREE.PlaneGeometry(width, depth, segments, segments);
            const vertices = geometry.attributes.position.array;

            // Apply height based on noise
            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i];
                const y = vertices[i + 1];

                // Calculate distance from center for coastal gradient
                const distFromCenter = Math.sqrt(x * x + y * y);
                const maxDist = width / 2;
                const coastalFactor = Math.max(0, 1 - Math.pow(distFromCenter / (maxDist * 0.85), 3));

                let height = multiOctaveNoise(x, y);

                // Create extremely dramatic dune formations
                const dunePattern =
                    Math.sin(x * 0.015 + y * 0.008) * 60 +
                    Math.sin(x * 0.01 - y * 0.012) * 50 +
                    Math.sin(x * 0.006 + y * 0.006) * 40;

                // Add massive sharp ridges for towering peaks
                const ridgePattern = Math.abs(Math.sin(x * 0.02)) *
                                   Math.abs(Math.cos(y * 0.015)) * 80;

                // Add extra large-scale formations
                const megaDunes = Math.sin(x * 0.005) * Math.cos(y * 0.004) * 100;

                // Combine patterns for extreme variation
                height = height * 80 + dunePattern + ridgePattern + megaDunes;

                // Add fine detail
                const detail = noise(x * 0.5, y * 0.5, 999) * 3;
                height += detail;

                // Apply coastal gradient - dunes taper down to beach level near edges
                height = height * coastalFactor + (1 - coastalFactor) * 2;

                vertices[i + 2] = height;
            }

            geometry.computeVertexNormals();
            geometry.rotateX(-Math.PI / 2);

            return geometry;
        }

        // Create large sand dune terrain (3000x3000 units, 300 segments)
        const terrainGeometry = generateTerrain(3000, 3000, 300);

        // Sand material with realistic colors
        const sandMaterial = new THREE.MeshStandardMaterial({
            color: 0xd4a574,
            roughness: 0.9,
            metalness: 0.1,
            flatShading: false,
            side: THREE.DoubleSide,
        });

        const terrain = new THREE.Mesh(terrainGeometry, sandMaterial);
        terrain.receiveShadow = true;
        terrain.castShadow = true;
        scene.add(terrain);

        // Add some variation with vertex colors
        const colors = [];
        const color1 = new THREE.Color(0xd4a574);
        const color2 = new THREE.Color(0xc9a060);
        const color3 = new THREE.Color(0xe5c89e);
        const color4 = new THREE.Color(0xb8936f);

        for (let i = 0; i < terrainGeometry.attributes.position.count; i++) {
            const mix = Math.random();
            let color;
            if (mix < 0.25) {
                color = color1.clone();
            } else if (mix < 0.5) {
                color = color2.clone();
            } else if (mix < 0.75) {
                color = color3.clone();
            } else {
                color = color4.clone();
            }
            colors.push(color.r, color.g, color.b);
        }

        terrainGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        sandMaterial.vertexColors = true;

        // Ocean water with animated waves
        const oceanGeometry = new THREE.PlaneGeometry(6000, 6000, 100, 100);
        const oceanMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a5f7a,
            roughness: 0.3,
            metalness: 0.6,
            transparent: true,
            opacity: 0.85,
            side: THREE.DoubleSide,
        });
        const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = 0; // Sea level
        ocean.receiveShadow = true;
        scene.add(ocean);

        // Store original ocean vertices for wave animation
        const oceanOriginalVertices = oceanGeometry.attributes.position.array.slice();

        // Sky
        const skyGeometry = new THREE.SphereGeometry(1800, 32, 32);
        const skyMaterial = new THREE.MeshBasicMaterial({
            color: 0x87ceeb,
            side: THREE.BackSide,
        });
        const sky = new THREE.Mesh(skyGeometry, skyMaterial);
        scene.add(sky);

        // Controls
        const controls = new PointerLockControls(camera, document.body);

        document.body.addEventListener('click', () => {
            controls.lock();
        });

        // Movement
        const moveSpeed = 0.5;
        const fastMoveSpeed = 1.5;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const keys = {};
        let isFlying = true; // Start in fly mode

        document.addEventListener('keydown', (event) => {
            keys[event.code] = true;

            if (event.code === 'Space') {
                event.preventDefault();
                isFlying = !isFlying;
                document.getElementById('mode-indicator').textContent =
                    isFlying ? 'Fly Mode' : 'Walk Mode';
            }
        });

        document.addEventListener('keyup', (event) => {
            keys[event.code] = false;
        });

        // Raycaster for ground detection
        const raycaster = new THREE.Raycaster();
        raycaster.ray.direction.set(0, -1, 0);

        function getTerrainHeight(x, z) {
            raycaster.ray.origin.set(x, 1000, z);
            const intersects = raycaster.intersectObject(terrain);
            if (intersects.length > 0) {
                return intersects[0].point.y;
            }
            // If raycast fails, return current camera height to avoid dropping underground
            return camera.position.y - 3;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Animate ocean waves
            const time = Date.now() * 0.0005;
            const oceanVertices = oceanGeometry.attributes.position.array;
            for (let i = 0; i < oceanVertices.length; i += 3) {
                const x = oceanOriginalVertices[i];
                const z = oceanOriginalVertices[i + 1];

                // Create gentle wave motion
                oceanVertices[i + 2] =
                    Math.sin(x * 0.01 + time) * 0.8 +
                    Math.cos(z * 0.01 + time * 1.3) * 0.6 +
                    Math.sin((x + z) * 0.008 + time * 0.7) * 0.5;
            }
            oceanGeometry.attributes.position.needsUpdate = true;
            oceanGeometry.computeVertexNormals();

            if (controls.isLocked) {
                const speed = keys['ShiftLeft'] ? fastMoveSpeed : moveSpeed;

                // Get camera direction for horizontal movement only
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0; // Flatten to horizontal plane
                forward.normalize();

                const right = new THREE.Vector3();
                right.crossVectors(forward, new THREE.Vector3(0, 1, 0));
                right.normalize();

                // Calculate movement direction
                const moveDirection = new THREE.Vector3();

                if (keys['KeyW']) moveDirection.add(forward);
                if (keys['KeyS']) moveDirection.sub(forward);
                if (keys['KeyD']) moveDirection.add(right);
                if (keys['KeyA']) moveDirection.sub(right);

                if (moveDirection.length() > 0) {
                    moveDirection.normalize();
                    camera.position.x += moveDirection.x * speed;
                    camera.position.z += moveDirection.z * speed;
                }

                // Keep camera within terrain bounds (3000x3000 terrain)
                const maxDistance = 1490; // Slightly less than terrain size/2
                camera.position.x = Math.max(-maxDistance, Math.min(maxDistance, camera.position.x));
                camera.position.z = Math.max(-maxDistance, Math.min(maxDistance, camera.position.z));

                // Handle vertical movement based on mode
                if (isFlying) {
                    // Free flying
                    if (keys['KeyQ']) {
                        camera.position.y += speed; // Q goes up
                    }
                    if (keys['KeyE']) {
                        camera.position.y -= speed; // E goes down
                    }
                } else {
                    // Walk mode - stick to terrain
                    const terrainHeight = getTerrainHeight(camera.position.x, camera.position.z);
                    camera.position.y = terrainHeight + 5; // 5 units above terrain
                }
            }

            // Update debug info
            document.getElementById('debug-info').innerHTML =
                `X: ${camera.position.x.toFixed(1)}<br>` +
                `Y: ${camera.position.y.toFixed(1)}<br>` +
                `Z: ${camera.position.z.toFixed(1)}`;

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
